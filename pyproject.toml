[project]
name = "coralsnake"
version = "0.0.116"
description = "Transcriptome mapping utils"
authors = [{ name = "Chang Ye", email = "yech1990@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "GPL-3.0"}
keywords = ["transcriptome", "mapping"]
# Runtime dependencies only (build tools belong under [build-system])
dependencies = [
  "bwamem>=0.0.8",
  "ruranges>=0.0.14",
  "numpy>=1.26",
  "pyfamsa>=0.4",
  "pysam>=0.22",
  "rich>=13.0.0",
  "rich-click>=1.8.3",
  "scipy>=1.14",
]

[project.urls]
Repository = "https://github.com/y9c/coralsnake"

[project.scripts]
coralsnake = "coralsnake.cli:cli"

[dependency-groups]
# Development-only tools (not required at runtime)
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=75.3.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coralsnake"]
