[project]
name = "coralsnake"
version = "0.1.1"
description = "Exon-aware RNA pipeline: splicing-aware liftover (tbam2gbam/gbam2tbam), metagene, annotation"
authors = [{ name = "Chang Ye", email = "yech1990@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "GPL-3.0-only" }
keywords = ["transcriptome", "exon", "liftover", "metagene", "genomics", "variant", "rna", "polars"]
# Runtime dependencies only (build tools belong under [build-system])
dependencies = [
  "ruranges>=0.0.14",
  "numpy>=1.26",
  "polars>=1.30.0",
  "pyfamsa>=0.4",
  "pysam>=0.22",
  "rich>=13.0.0",
  "rich-click>=1.8.3",
  "scipy>=1.14",
  "xopen>=1.9.0",
]

[project.optional-dependencies]
# Heavy visualization stack (matplotlib) - optional, keep the base install light
plot = [
  "matplotlib>=3.8,<4",
]

[project.urls]
Repository = "https://github.com/y9c/coralsnake"
Changelog = "https://github.com/y9c/coralsnake/blob/main/CHANGELOG.md"
Documentation = "https://coralsnake.yech.science/"

[project.scripts]
coralsnake = "coralsnake.cli:cli"

[dependency-groups]
# Development-only tools (not required at runtime)
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.3.2,<77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coralsnake"]


# force release
# force release sync
# ci: linux only release

