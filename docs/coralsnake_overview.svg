<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 598" width="100%" role="img"
     aria-label="Coralsnake pipeline diagram: prepare splices a gene into a transcript reference, an external mapper aligns reads, liftover splices reads between transcript and genome coordinates (t2g/g2t), then analysis (annotate, motif) feeds visualization (metagene profile, sequence logo).">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0460fc"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Title -->
  <text x="460" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#30353d">
    coralsnake — exon-aware RNA analysis
  </text>
  <text x="460" y="50" text-anchor="middle" font-size="12.5" fill="#6b7280">
    read alignment is external: bwa / prismalign / …
  </text>

  <!-- ================= PREPARE box ================= -->
  <rect x="40" y="70" width="400" height="140" rx="12" fill="#eef4ff" stroke="#0460fc" stroke-width="1.6"/>
  <text x="58" y="93" font-size="15" font-weight="700" fill="#0460fc">prepare</text>
  <text x="70" y="113" font-size="10.5" fill="#6b7280">genome</text>
  <!-- genome track: intron line + exon boxes -->
  <line x1="70" y1="127" x2="300" y2="127" stroke="#9ca3af" stroke-width="1.4"/>
  <rect x="75"  y="119" width="32" height="16" fill="#bfdbfe" stroke="#0460fc" stroke-width="1.2"/>
  <rect x="150" y="119" width="32" height="16" fill="#bfdbfe" stroke="#0460fc" stroke-width="1.2"/>
  <rect x="245" y="119" width="32" height="16" fill="#bfdbfe" stroke="#0460fc" stroke-width="1.2"/>
  <!-- splice arrow -->
  <line x1="120" y1="139" x2="120" y2="163" stroke="#0460fc" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="129" y="155" font-size="10.5" fill="#6b7280">splice</text>
  <!-- transcript: exons joined contiguously -->
  <line x1="75" y1="175" x2="171" y2="175" stroke="#9ca3af" stroke-width="1.4"/>
  <rect x="75"  y="167" width="32" height="16" fill="#bfdbfe" stroke="#0460fc" stroke-width="1.2"/>
  <rect x="107" y="167" width="32" height="16" fill="#bfdbfe" stroke="#0460fc" stroke-width="1.2"/>
  <rect x="139" y="167" width="32" height="16" fill="#bfdbfe" stroke="#0460fc" stroke-width="1.2"/>
  <text x="70" y="197" font-size="10.5" fill="#6b7280">spliced transcript</text>
  <!-- output chip -->
  <rect x="300" y="148" width="120" height="36" rx="8" fill="#ffffff" stroke="#0460fc" stroke-width="1.2"/>
  <text x="360" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#0460fc">transcript.fa</text>

  <!-- ================= EXTERNAL MAPPER box (dashed) ================= -->
  <rect x="480" y="70" width="400" height="140" rx="12" fill="#fafafa" stroke="#9ca3af"
        stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="498" y="93" font-size="14" font-weight="600" fill="#6b7280">external mapper</text>
  <text x="498" y="110" font-size="11" fill="#9ca3af">(bwa / prismalign — not part of coralsnake)</text>
  <!-- reads -->
  <rect x="520" y="132" width="54" height="9" rx="2" fill="#cbd5e1"/>
  <rect x="532" y="148" width="54" height="9" rx="2" fill="#cbd5e1"/>
  <rect x="520" y="164" width="54" height="9" rx="2" fill="#cbd5e1"/>
  <text x="547" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">reads</text>
  <line x1="576" y1="150" x2="656" y2="150" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <!-- tx.bam chip -->
  <rect x="666" y="130" width="124" height="40" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="728" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b7280">tx.bam</text>

  <!-- reference connector: prepare -> mapper -->
  <path d="M 440 140 C 458 140, 462 140, 480 140" fill="none" stroke="#9ca3af"
        stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
  <text x="460" y="130" text-anchor="middle" font-size="10.5" fill="#6b7280">reference</text>

  <!-- arrows: prepare / mapper -> liftover -->
  <line x1="240" y1="210" x2="240" y2="240" stroke="#0460fc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="210" x2="680" y2="240" stroke="#0460fc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= LIFT OVER box ================= -->
  <rect x="160" y="240" width="600" height="140" rx="12" fill="#eef4ff" stroke="#0460fc" stroke-width="1.6"/>
  <text x="178" y="263" font-size="15" font-weight="700" fill="#0460fc">liftover</text>
  <!-- transcript track (contiguous read) -->
  <text x="190" y="291" font-size="11" fill="#6b7280">transcript</text>
  <rect x="250" y="283" width="210" height="14" rx="3" fill="#0460fc"/>
  <circle cx="360" cy="290" r="4" fill="#d63384"/>
  <!-- genome track (split read + intron gap) -->
  <text x="190" y="351" font-size="11" fill="#6b7280">genome</text>
  <rect x="250" y="343" width="110" height="14" rx="3" fill="#0460fc"/>
  <line x1="360" y1="350" x2="450" y2="350" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="450" y="343" width="100" height="14" rx="3" fill="#0460fc"/>
  <!-- bidirectional t2g / g2t arrow -->
  <line x1="300" y1="303" x2="300" y2="339" stroke="#0460fc" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="655" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#0460fc">t2g ⇄ g2t</text>
  <text x="655" y="340" text-anchor="middle" font-size="11" fill="#6b7280">splice (t2g) · clip + join (g2t)</text>

  <!-- arrows: liftover -> analysis / visualization panels -->
  <line x1="175" y1="380" x2="139" y2="410" stroke="#0460fc" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="353" y1="380" x2="353" y2="410" stroke="#0460fc" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="567" y1="380" x2="567" y2="410" stroke="#0460fc" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="745" y1="380" x2="781" y2="410" stroke="#0460fc" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= ANALYSIS: annotate ================= -->
  <rect x="40" y="412" width="198" height="150" rx="12" fill="#eef4ff" stroke="#0460fc" stroke-width="1.6"/>
  <text x="54" y="436" font-size="14" font-weight="700" fill="#0460fc">annotate</text>
  <text x="54" y="455" font-size="10" fill="#6b7280">site → region / gene / effect</text>
  <rect x="52"  y="470" width="48" height="18" fill="#bfdbfe" stroke="#0460fc" stroke-width="1"/>
  <rect x="100" y="470" width="78" height="18" fill="#0460fc" opacity="0.85"/>
  <rect x="178" y="470" width="48" height="18" fill="#bfdbfe" stroke="#0460fc" stroke-width="1"/>
  <text x="76"  y="503" text-anchor="middle" font-size="9.5" fill="#374151">5'UTR</text>
  <text x="139" y="503" text-anchor="middle" font-size="9.5" fill="#374151">CDS</text>
  <text x="202" y="503" text-anchor="middle" font-size="9.5" fill="#374151">3'UTR</text>
  <circle cx="76"  cy="479" r="4" fill="#d63384"/>
  <circle cx="139" cy="479" r="4" fill="#d63384"/>
  <text x="139" y="530" text-anchor="middle" font-size="10" fill="#374151">region · gene · effect</text>

  <!-- ================= ANALYSIS: motif ================= -->
  <rect x="254" y="412" width="198" height="150" rx="12" fill="#eef4ff" stroke="#0460fc" stroke-width="1.6"/>
  <text x="268" y="436" font-size="14" font-weight="700" fill="#0460fc">motif</text>
  <text x="268" y="455" font-size="10" fill="#6b7280">strand-aware motif → logo</text>
  <text x="268" y="476" class="mono" font-size="12.5" fill="#374151">A  C  G  T</text>
  <text x="268" y="490" class="mono" font-size="12.5" fill="#374151">A  C  G  G</text>
  <text x="268" y="504" class="mono" font-size="12.5" fill="#374151">C  C  G  T</text>
  <text x="268" y="528" font-size="10" fill="#6b7280">positions from the reference</text>

  <!-- ================= VISUALIZATION: metagene ================= -->
  <rect x="468" y="412" width="198" height="150" rx="12" fill="#eafaf1" stroke="#2f855a" stroke-width="1.6"/>
  <text x="482" y="436" font-size="14" font-weight="700" fill="#2f855a">metagene</text>
  <text x="482" y="455" font-size="10" fill="#6b7280">profile across 5'UTR/CDS/3'UTR</text>
  <!-- region bar -->
  <rect x="480" y="470" width="58" height="14" fill="#bbf7d0" stroke="#2f855a" stroke-width="0.8"/>
  <rect x="538" y="470" width="58" height="14" fill="#2f855a" opacity="0.85"/>
  <rect x="596" y="470" width="58" height="14" fill="#bbf7d0" stroke="#2f855a" stroke-width="0.8"/>
  <text x="509" y="497" text-anchor="middle" font-size="9.5" fill="#374151">5'UTR</text>
  <text x="567" y="497" text-anchor="middle" font-size="9.5" fill="#374151">CDS</text>
  <text x="625" y="497" text-anchor="middle" font-size="9.5" fill="#374151">3'UTR</text>
  <!-- profile curve + fill -->
  <polygon points="480,540 498,527 516,506 538,495 556,489 567,487 578,491 596,506 614,527 636,540 654,544 654,548 480,548"
           fill="#2f855a" opacity="0.16"/>
  <polyline points="480,540 498,527 516,506 538,495 556,489 567,487 578,491 596,506 614,527 636,540 654,544"
            fill="none" stroke="#2f855a" stroke-width="2"/>
  <line x1="480" y1="548" x2="654" y2="548" stroke="#2f855a" stroke-width="1.2"/>

  <!-- ================= VISUALIZATION: logo ================= -->
  <rect x="682" y="412" width="198" height="150" rx="12" fill="#eafaf1" stroke="#2f855a" stroke-width="1.6"/>
  <text x="696" y="436" font-size="14" font-weight="700" fill="#2f855a">logo</text>
  <text x="696" y="455" font-size="10" fill="#6b7280">sequence logo</text>
  <!-- 4 stacked-letter columns -->
  <text x="730" y="552" class="mono" font-size="30" font-weight="700" fill="#1f77b4" text-anchor="middle">A</text>
  <text x="730" y="530" class="mono" font-size="12" font-weight="700" fill="#d62728" text-anchor="middle">C</text>
  <text x="764" y="552" class="mono" font-size="30" font-weight="700" fill="#d62728" text-anchor="middle">C</text>
  <text x="764" y="530" class="mono" font-size="12" font-weight="700" fill="#1f77b4" text-anchor="middle">A</text>
  <text x="798" y="552" class="mono" font-size="30" font-weight="700" fill="#2ca02c" text-anchor="middle">G</text>
  <text x="798" y="530" class="mono" font-size="12" font-weight="700" fill="#9467bd" text-anchor="middle">T</text>
  <text x="832" y="552" class="mono" font-size="30" font-weight="700" fill="#9467bd" text-anchor="middle">T</text>
  <text x="832" y="530" class="mono" font-size="12" font-weight="700" fill="#2ca02c" text-anchor="middle">G</text>

  <!-- group labels -->
  <text x="246" y="576" text-anchor="middle" font-size="11" font-weight="600" fill="#9ca3af">analysis</text>
  <text x="674" y="576" text-anchor="middle" font-size="11" font-weight="600" fill="#9ca3af">visualization</text>
</svg>
